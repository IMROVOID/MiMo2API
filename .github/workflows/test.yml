name: Test & Verify

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip running automated tests'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        if: |
          inputs.skip_tests != true &&
          !contains(github.event.head_commit.message, '[skip test]') &&
          !contains(github.event.head_commit.message, '[skip tests]') &&
          !contains(github.event.head_commit.message, '[skip-test]') &&
          !contains(github.event.head_commit.message, '[skip-tests]') &&
          !contains(github.event.pull_request.title, '[skip test]') &&
          !contains(github.event.pull_request.title, '[skip tests]') &&
          !contains(github.event.pull_request.title, '[skip-test]') &&
          !contains(github.event.pull_request.title, '[skip-tests]')
        run: npm test

      - name: Skip tests notice
        if: |
          inputs.skip_tests == true ||
          contains(github.event.head_commit.message, '[skip test]') ||
          contains(github.event.head_commit.message, '[skip tests]') ||
          contains(github.event.head_commit.message, '[skip-test]') ||
          contains(github.event.head_commit.message, '[skip-tests]') ||
          contains(github.event.pull_request.title, '[skip test]') ||
          contains(github.event.pull_request.title, '[skip tests]') ||
          contains(github.event.pull_request.title, '[skip-test]') ||
          contains(github.event.pull_request.title, '[skip-tests]')
        run: echo "ℹ️ Automated tests skipped via skip flag."

      - name: Verify build bundles
        run: npm run build
